<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sen uchun kichkina kviz 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1ee;--bg2:#fdd5da;--ink:#3b2a30;--muted:#a8838c;--pink:#d6336c;--pink2:#e8527f;--card:#fff;--shadow:0 6px 18px rgba(214,51,108,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1a20;--bg2:#3d2230;--ink:#fbe9ee;--muted:#c9a0ad;--card:#4a2a38;--shadow:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg1:#2a1a20;--bg2:#3d2230;--ink:#fbe9ee;--muted:#c9a0ad;--card:#4a2a38;--shadow:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Comfortaa',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:100%;max-width:420px;padding:24px;text-align:center;position:relative;z-index:2}
.script{font-family:'Pacifico',cursive;color:var(--pink);font-size:1rem;margin:0 0 10px}
h1{font-size:1.6rem;line-height:1.25;margin:0 0 14px}
p.sub{color:var(--muted);font-size:.85rem;margin:0 0 24px}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:22px}
button.opt{font:inherit;font-weight:700;font-size:.95rem;border:0;border-radius:14px;padding:15px 18px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;transition:transform .25s,opacity .4s}
button.opt.main{background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff}
button.opt:active{transform:scale(.97)}
button.opt.gone{opacity:0;transform:translateY(14px) rotate(-4deg) scale(.9);pointer-events:none}
.screen{animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2d1b22;color:#fff;font-size:.8rem;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;transition:.3s;z-index:5;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ticket{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;text-align:left;margin:18px 0}
.ticket .t{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--pink);border-bottom:1px dashed var(--muted);padding-bottom:12px;margin-bottom:12px}
.ticket .t small{display:block;color:var(--muted);font-size:.6rem;letter-spacing:.08em}
.row{display:flex;justify-content:space-between;font-size:.8rem;padding:5px 0}
.row span:first-child{color:var(--muted);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
.row span:last-child{font-weight:700}
.note{font-family:'Pacifico',cursive;color:var(--pink);font-size:.9rem;line-height:1.6;margin:0}
a.again{color:var(--muted);font-size:.7rem;display:inline-block;margin-top:14px;cursor:pointer;text-decoration:underline}
.heart{position:fixed;bottom:-30px;z-index:1;opacity:.5;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
// ====== SHU YERNI OʻZGARTIR ======
var HER = "Sarvinoz", HIS = "Akmal";
var DATE_TXT = "Chorshanba, 24-iyun", TIME_TXT = "23:00";
// =================================
var steps = [
 {q:"Chorshanba kuni vaqting bormi?", o:[["Ha, albatta bor 💘",1],["Band boʻlishim mumkin 🤔",0,"Yoʻq-yoʻq 🙈"],["Hmm, bilmadim 😏",0,"Yoʻq-yoʻq 🙈"]]},
 {q:"Birga qayerga boramiz?", key:"place", o:[["Magic City 🎡",1],["Yana ishga 💼",0,"Bugun boʻlmaydi 😤"],["Hech qayerga, dangasalik 🛌",0,"Bugun boʻlmaydi 😤"]]},
 {q:"Nima koʻramiz?", key:"film", o:[["Qoʻrqinchli film 🎬",1],["Soliqlar haqida film 📊",0,"Yoʻq endi 😂"]]},
 {q:"Shu oqshomni men bilan oʻtkazasanmi?", o:[["Ha, albatta ❤️",1],["Oʻylab koʻrishim kerak 🤨",0,"Hmm, notoʻgʻri javob 🙃"]]}
];
var i = -1, app = document.getElementById('app'), toast = document.getElementById('toast'), tt, picks = {};
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},1400)}
function heart(){var h=document.createElement('div');h.className='heart';h.textContent=['💗','💕','💖'][Math.random()*3|0];h.style.left=Math.random()*100+'vw';h.style.fontSize=(12+Math.random()*16)+'px';h.style.animationDuration=(6+Math.random()*6)+'s';document.body.appendChild(h);setTimeout(function(){h.remove()},12000)}
setInterval(heart,900);
function intro(){
 i=-1;picks={};
 app.innerHTML='<div class="screen"><p class="script">sen uchun, '+HER+' 💌</p><h1>Kichkina kviz —<br>katta sir bilan</h1><p class="sub">Bir nechta savolga javob ber — lekin ehtiyot boʻl, baʼzi tugmalar injiq 😉</p><div class="opts"><button class="opt main" id="go">Boshladik ✨</button></div></div>';
 document.getElementById('go').onclick=next;
}
function next(){
 i++;
 if(i>=steps.length) return end();
 var s=steps[i];
 app.innerHTML='<div class="screen"><h1>'+s.q+'</h1><div class="opts" id="opts"></div></div>';
 var box=document.getElementById('opts');
 s.o.forEach(function(o){
  var b=document.createElement('button');b.className='opt'+(o[1]?' main':'');b.textContent=o[0];
  b.onclick=function(){
   if(o[1]){if(s.key)picks[s.key]=o[0].replace(/ \S+$/,'');say('Ajoyib tanlov 💖');setTimeout(next,450)}
   else{say(o[2]);b.classList.add('gone');setTimeout(function(){b.style.display='none'},450)}
  };
  box.appendChild(b);
 });
}
function end(){
 for(var k=0;k<25;k++)setTimeout(heart,k*60);
 app.innerHTML='<div class="screen"><p class="script">toʻgʻri tanlading 💗</p><h1>Bu — uchrashuv!</h1>'+
 '<div class="ticket"><div class="t">🎬<div>'+(picks.place||'Magic City')+'<small>IKKI KISHILIK CHIPTA</small></div></div>'+
 '<div class="row"><span>Seans</span><span>'+(picks.film||'Qoʻrqinchli film')+'</span></div>'+
 '<div class="row"><span>Qachon</span><span>'+DATE_TXT+'</span></div>'+
 '<div class="row"><span>Vaqt</span><span>'+TIME_TXT+'</span></div>'+
 '<div class="row"><span>Joy</span><span>yonimda ❤️</span></div></div>'+
 '<p class="note">Chiroyli boʻlib tayyorlan,<br>qolganini oʻzim hal qilaman 💗</p>'+
 '<p class="sub" style="margin-top:10px;font-style:italic">Seni taklif qilyapti — seviklisi '+HIS+'</p>'+
 '<a class="again" id="again">yana bir bor oʻtish</a></div>';
 document.getElementById('again').onclick=intro;
}
intro();
</script>
</body>
</html>
